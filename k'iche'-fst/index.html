<body>
<main>

  <header>
    <h1><a href="/">haiwei hu</a> <span aria-hidden="true"></span></h1>
    <nav>
      <a href="/">about</a><span class="sep">·</span>
      <a href="/biloxi-dictionary/">Biloxi dictionary</a><span class="sep">·</span>

      <a href="/cv/">cv</a>
    </nav>
  </header>

  <hr class="rule">

  <div class="tool-page">
  <div class="tool-grid">
    <div class="fst-section">
      <h3>Search</h3>
      <input type="text" id="word-input" class="tool-search" placeholder="Search K'iche' words…" autocomplete="off" />
      <div class="fst-hint" id="featured-chips"></div>
      <div id="status" class="tool-status"></div>
      <ul id="wordlist" class="tool-list"></ul>
    </div>
    <div class="fst-section">
      <h3>Analysis</h3>
      <div id="output"></div>
    </div>
  </div>
</div>
<script>
let dictionary = {};
let wordlist = [];
let filtered = [];
let selectedIndex = -1;

const featuredWords = [
  "nutinamit",
  "katinchʼabʼej",
  "qachʼabʼal",
  "jun",
  "xekitzoqopij",
  "ubʼajixik",
  "retzʼabʼaʼl",
  "kixkitzuqu"
];

const input = document.getElementById('word-input');
const listEl = document.getElementById('wordlist');
const statusEl = document.getElementById('status');
const output = document.getElementById('output');
const chipsEl = document.getElementById('featured-chips');

// Load both data files
Promise.all([
  fetch('/assets/json/quc_dict.json').then(r => r.json()),
  fetch('/assets/json/quc_wordlist.json').then(r => r.json())
]).then(([dict, words]) => {
  dictionary = dict;
  wordlist = words;
  renderFeatured();
  renderList(wordlist);
  statusEl.textContent = 'Type to filter ' + wordlist.length.toLocaleString() + ' words';
}).catch(err => {
  statusEl.textContent = 'Error loading dictionary.';
});

function normalize(str) {
  return str.toLowerCase()
    .replace(/['’'‘'´]/g, 'ʼ')
    .normalize('NFD').replace(/̈/g, '').normalize('NFC');
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
}

function renderFeatured() {
  chipsEl.innerHTML = 'Try these: ' + featuredWords.map(w =>
    '<code data-word="' + escapeHtml(w) + '">' + escapeHtml(w) + '</code>'
  ).join(' ');
}

function filterWords(query) {
  const q = normalize(query);
  if (!q) return wordlist;

  const matches = wordlist.filter(w => normalize(w).includes(q));

  matches.sort((a, b) => {
    const aNorm = normalize(a);
    const bNorm = normalize(b);
    const aStarts = aNorm.startsWith(q);
    const bStarts = bNorm.startsWith(q);
    if (aStarts && !bStarts) return -1;
    if (!aStarts && bStarts) return 1;
    return aNorm.localeCompare(bNorm);
  });

  return matches;
}

function renderList(words) {
  filtered = words;
  selectedIndex = -1;
  if (words.length === 0) {
    listEl.innerHTML = '<li class="no-match">No matches</li>';
    return;
  }
  listEl.innerHTML = words.map((w, i) =>
    '<li data-index="' + i + '" data-word="' + escapeHtml(w) + '">' + escapeHtml(w) + '</li>'
  ).join('');
}

function updateStatus(query) {
  const q = query.trim();
  if (!q) {
    statusEl.textContent = wordlist.length.toLocaleString() + ' words';
  } else {
    const total = wordlist.filter(w => normalize(w).includes(normalize(q))).length;
    statusEl.textContent = total + ' matches for "' + escapeHtml(q) + '"';
  }
}

function selectWord(word) {
  input.value = word;
  renderList(filterWords(word));
  updateStatus(word);
  analyse(word);
}

function setActive(idx) {
  const items = listEl.querySelectorAll('li[data-index]');
  items.forEach(el => el.classList.remove('active'));
  if (idx >= 0 && idx < items.length) {
    items[idx].classList.add('active');
    items[idx].scrollIntoView({ block: 'nearest' });
  }
}

// Input events
input.addEventListener('input', function() {
  const q = input.value;
  renderList(filterWords(q));
  updateStatus(q);
});

input.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    selectedIndex = Math.min(selectedIndex + 1, filtered.length - 1);
    setActive(selectedIndex);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    selectedIndex = Math.max(selectedIndex - 1, 0);
    setActive(selectedIndex);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (selectedIndex >= 0 && filtered[selectedIndex]) {
      selectWord(filtered[selectedIndex]);
    } else if (filtered.length === 1) {
      selectWord(filtered[0]);
    } else {
      analyse(input.value.trim());
    }
  }
});

// List click
listEl.addEventListener('click', function(e) {
  const li = e.target.closest('li[data-word]');
  if (!li) return;
  selectWord(li.dataset.word);
});

// Featured chips click
chipsEl.addEventListener('click', function(e) {
  const chip = e.target.closest('code');
  if (!chip) return;
  selectWord(chip.dataset.word);
});

// Analysis
function analyse(raw) {
  const key = normalize(raw);
  if (!key) { output.innerHTML = ''; return; }

  const entry = dictionary[key];
  if (!entry) {
    output.innerHTML = '<div class="tool-callout">No analysis found for <strong>' + escapeHtml(raw) + '</strong>.</div>';
    return;
  }

  const morphemes = entry.morphemes || [];
  const analyses = entry.analyses || [];

  if (morphemes.length === 0 && analyses.length === 0) {
    output.innerHTML = '<div class="tool-callout">No analysis found for <strong>' + escapeHtml(raw) + '</strong>.</div>';
    return;
  }

  let html = '<p><strong>' + escapeHtml(raw) + '</strong>';
  if (analyses.length > 0) {
    html += ' &mdash; ' + analyses.length + ' analys' + (analyses.length === 1 ? 'is' : 'es');
  }
  if (morphemes.length > 0) {
    html += ', ' + morphemes.length + ' segmentation' + (morphemes.length === 1 ? '' : 's');
  }
  html += '</p>';

  if (morphemes.length > 0) {
    html += '<p class="seg-label">Segmentations</p>';
    html += '<div class="seg-list">';
    morphemes.forEach(seg => {
      html += '<div class="seg-chain">';
      seg.forEach((m, i) => {
        html += '<span class="morpheme">' + escapeHtml(m) + '</span>';
        if (i < seg.length - 1) html += '<span class="seg-sep">-</span>';
      });
      html += '</div>';
    });
    html += '</div>';
  }

  if (analyses.length > 0) {
    html += '<table class="tool-table"><thead><tr><th>#</th><th>Analysis</th></tr></thead><tbody>';
    analyses.forEach((a, i) => {
      html += '<tr><td>' + (i + 1) + '</td><td><code>' + escapeHtml(a) + '</code></td></tr>';
    });
    html += '</tbody></table>';
  }

  output.innerHTML = html;
}
</script>
